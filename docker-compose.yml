services:
  web:
    container_name: productivity-backend
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "9001:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - productivity-network
      
  redis:
    container_name: productivity-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - productivity-network
      
  celery:
    container_name: productivity-celery
    build: .
    command: celery -A backend worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - productivity-network

  celery-beat:
    container_name: productivity-celery-beat
    build: .
    command: celery -A backend beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - productivity-network


networks:
  productivity-network:
    driver: bridge